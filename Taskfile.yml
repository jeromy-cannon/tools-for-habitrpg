version: '3'

tasks:
  default:
    cmds:
      - task: clean
      - task: build

  clean:
    cmds:
      - rm -Rf dist

  build:
    cmds:
      - source ~/.nvm/nvm.sh && nvm use v23 && pnpm exec tsc

  run:
    cmds:
      - task: default
      - source ~/.nvm/nvm.sh && nvm use v23 && pnpm exec tsx src/export.ts {{.CLI_ARGS}}

  format:
    cmds:
      - source ~/.nvm/nvm.sh && nvm use v23 && pnpm eslint --fix
